name: Trigger auto deployment for inventory-system

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/inventory-system-AutoDeployTrigger-936b494b-480a-4f8e-9688-7cfef73c04ed.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.INVENTORYSYSTEM_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.INVENTORYSYSTEM_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.INVENTORYSYSTEM_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.INVENTORYSYSTEM_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.INVENTORYSYSTEM_REGISTRY_PASSWORD }}
          containerAppName: inventory-system
          resourceGroup: test-resource-group
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


