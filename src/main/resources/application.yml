spring:
  application:
    name: inventory-service
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: "${AZURE_TENANT_ID}"
        credential:
          client-id: "${WEB_API_BACKEND_CLIENT_ID}"
          client-secret: "${WEB_API_BACKEND_CLIENT_SECRET}"
        app-id-uri: "${WEB_API_BACKEND_APP_ID_URI}"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventorydb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:admin}
server:
  port: 8080
logging:
  level:
    root: INFO
    com.example.inventoryservice: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
